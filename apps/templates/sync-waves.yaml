apiVersion: harnessproj.io/v1alpha1
kind: Application
metadata:
  name: sync-waves
  namespace: pedro
  finalizers:
  - resources-finalizer.harnesscd.harnessproj.io
spec:
  destination:
    namespace: pedro
    server: {{ .Values.spec.destination.server }}
  project: default
  source:
    path: sync-waves
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
